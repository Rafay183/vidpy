[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidpy-ray"
version = "0.1.1"
description = "Open-source video editing studio in Python - a browser editor on localhost, a Python API and a CLI powered by FFmpeg: 79 video effects, 41 audio effects, 58 transitions, smart auto-editing and multi-format export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Rafay Shaikh" }]
maintainers = [{ name = "Muhammad Rafay Shaikh" }]
keywords = ["video", "video-editor", "ffmpeg", "nle", "editing", "effects", "transitions", "audio", "studio", "localhost"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: JavaScript",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
  "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dependencies = []  # pure standard library; only needs the FFmpeg binary

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4"]  # bundles a static ffmpeg if you don't have one installed
dev = ["pytest>=7", "ruff>=0.6", "build", "twine"]

[project.scripts]
vidpy = "vidpy.cli:main"

[project.urls]
Homepage = "https://github.com/rafay183/vidpy"
Source = "https://github.com/rafay183/vidpy"
Issues = "https://github.com/rafay183/vidpy/issues"
Changelog = "https://github.com/rafay183/vidpy/blob/main/CHANGELOG.md"
Documentation = "https://github.com/rafay183/vidpy#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vidpy*"]

[tool.setuptools.package-data]
vidpy = ["web/*"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["src/vidpy/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731", "B008", "B904", "E741", "B905", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
