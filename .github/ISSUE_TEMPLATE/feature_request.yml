name: ✨ Feature request
description: Suggest a new studio feature, smart tool or export format
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Mock-ups and comparisons with Premiere / DaVinci / CapCut are welcome.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
